[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowbank-screen"
version = "0.1.0"
description = "Screen wire activity against the findings in FinCEN's November 2026 Iranian shadow banking Financial Trend Analysis, cluster the parties into networks, and estimate value not yet attributed with chain-ladder development. Standard errors use Mack (1993), this tool's choice; FinCEN cited Friedland's chain-ladder chapter. Engineering checklist, not legal advice. Tested on synthetic data only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["aml", "bsa", "fincen", "sanctions", "shadow-banking", "front-companies", "wire-transfers", "fraud-prevention"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/shadowbank-screen"

[project.scripts]
shadowbank = "shadowbank.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadowbank = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
